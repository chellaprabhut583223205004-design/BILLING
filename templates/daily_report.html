{% extends "base.html" %}

{% block content %}
<div class="page-card">
    <h2>Daily Collection Report</h2>

    <label for="reportDate">Select Date</label>
    <input type="date" id="reportDate" name="date"
           value="{{ today }}">
    <button hx-get="/partials/daily-report" hx-target="#reportBody"
            hx-include="#reportDate" hx-trigger="click">Generate Report</button>

    <h3>Total Bills: <span id="billCount">0</span></h3>
    <h3>Total Amount: ₹<span id="totalAmount">0.00</span></h3>

    <table>
        <thead>
            <tr>
                <th>Bill ID</th>
                <th>Customer</th>
                <th>Date & Time</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="reportBody" hx-get="/partials/daily-report" hx-trigger="load" hx-include="#reportDate">
            <tr><td colspan="4">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const el = document.getElementById("reportDate");
    if (el && !el.value) {
        el.value = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
    }
});
</script>
{% endblock %}
